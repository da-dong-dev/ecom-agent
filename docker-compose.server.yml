# ============================================================
# ecom-agent 服务器部署编排
#
# 使用：
#   cd /opt/apps/ecom-agent
#   docker compose -f docker-compose.server.yml up -d --build
#
# 前提：
#   1. 共享 Ollama 已在 ai-net 网络运行（/opt/apps/infra）
#   2. 仓库根目录有 .env（不提交 git）
#   3. data/ 由仓库提供（kb/eval），app.db 运行期生成
# ============================================================

name: ecom-agent

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
    volumes:
      - ./data:/app/data
    depends_on:
      chroma:
        condition: service_started
    networks:
      default: {}
      # 给 evalflow 一个稳定别名，避免两个 compose 项目都叫 backend 造成 DNS 冲突
      ai-net:
        aliases:
          - ecom-backend
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8091/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    mem_limit: 512m

volumes:
  chroma_data:

networks:
  ai-net:
    external: true
